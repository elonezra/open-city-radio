name: Inspect GTA Radio frontend

on:
  push:
    branches:
      - feature/gtaradio-mobile-streams

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public audio client
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, ssl

          url = "https://gtaradio.net/build/games/assets/audio-vdcnt1eq.js"
          ua = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36"
          req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "*/*"})
          with urllib.request.urlopen(req, timeout=25, context=ssl.create_default_context()) as r:
              text = r.read().decode("utf-8", "replace")
          print("AUDIO_JS_BYTES", len(text))

          needles = [
              "https://audio.gtaradio.net",
              "changeStation=function",
              ".changeStation=function",
              "new Audio",
              "createElement(\"audio\")",
              ".src=",
              "new URL",
              "fetch(",
          ]
          for needle in needles:
              print("\n### NEEDLE", needle)
              start = 0
              count = 0
              while count < 10:
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  print(text[max(0, i-1800):min(len(text), i+2600)].replace("\n", " "))
                  print("\n---")
                  start = i + len(needle)
                  count += 1

          print("\n### AUDIO HOST EXPRESSIONS")
          for m in re.finditer(r'.{0,1000}audio\.gtaradio\.net.{0,1800}', text):
              print(m.group(0).replace("\n"," "))
              print("\n---")

          print("\n### LIKELY TEMPLATE EXPRESSIONS")
          for m in re.finditer(r'[^;]{0,500}(?:station|game|audio)[^;]{0,500};', text, re.I):
              s = m.group(0)
              if "audio.gtaradio.net" in s or ".src" in s or "fetch(" in s:
                  print(s[:2500].replace("\n"," "))
          PY
