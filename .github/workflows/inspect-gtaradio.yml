name: Inspect GTA Radio frontend

on:
  push:
    branches:
      - feature/gtaradio-mobile-streams

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public station streams and station ids
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, ssl

          ctx = ssl.create_default_context()
          ua = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36"
          games = ["vc","sa","3","4","lcs","vcs"]

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent":ua, "Accept":"*/*"})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return r.geturl(), dict(r.headers), r.read().decode("utf-8","replace")

          station_ids = {}
          for game in games:
              page = f"https://gtaradio.net/en/{game}"
              final, headers, html = get(page)
              scripts = [urllib.parse.urljoin(final, x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)]
              game_scripts = [u for u in scripts if f"/{game}-" in u]
              if not game_scripts:
                  print("NO_GAME_SCRIPT", game)
                  continue
              js_url = game_scripts[0]
              _, _, js = get(js_url)
              marker = js.find("dataset.station")
              window = js[max(0, marker-8000):marker+1000] if marker >= 0 else js
              pairs = re.findall(r'(?:^|[,\{])([A-Za-z0-9_$-]+):"([^"]+)"', window)
              # keep the last contiguous-looking name map before dataset.station; filter asset variables/noisy strings
              useful = [(k,v) for k,v in pairs if len(v) <= 80 and not v.startswith("/") and not v.startswith("#")]
              print("\nGAME", game, "JS", js_url)
              print("CANDIDATE_PAIRS", useful[-80:])
              station_ids[game] = useful

          samples = [
              ("vc","flash"), ("vc","vrock"), ("sa","k-dst"), ("3","head"),
              ("4","liberty_rock"), ("lcs","head"), ("vcs","emotion")
          ]
          for game, station in samples:
              url = f"https://audio.gtaradio.net/{game}/{station}"
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent":ua, "Accept":"audio/*,*/*;q=0.8", "Range":"bytes=0-2047"
                  })
                  with urllib.request.urlopen(req, timeout=8, context=ctx) as r:
                      chunk = r.read(2048)
                      print("STREAM", game, station, "status", r.status, "type", r.headers.get("Content-Type"),
                            "length", r.headers.get("Content-Length"), "accept-ranges", r.headers.get("Accept-Ranges"),
                            "icy-name", r.headers.get("icy-name"), "bytes", len(chunk),
                            "prefix", chunk[:16].hex())
              except Exception as e:
                  print("STREAM_ERROR", game, station, repr(e))
          PY
