name: Feature Android CI

on:
  push:
    branches:
      - feature/gtaradio-mobile-streams
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate GTA Radio manifest
        run: |
          python3 - <<'PY'
          import json
          p = "app/src/main/assets/gtaradio.json"
          data = json.load(open(p, encoding="utf-8"))
          assert len(data["worlds"]) == 6
          assert len(data["stations"]) == 69
          assert len({s["stationId"] for s in data["stations"]}) == 69
          assert all(s["audioSource"] == "stream" for s in data["stations"])
          assert all(s["audioUrl"].startswith("https://audio.gtaradio.net/") for s in data["stations"])
          print("Validated", len(data["stations"]), "GTA Radio stations")
          PY

      - name: Run tests, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-city-radio-gtaradio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
