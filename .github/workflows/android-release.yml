name: Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android API 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run core checks
        run: bash tools/check-core.sh

      - name: Patch known Kotlin compile blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/opencity/radio/MainActivity.kt")
          s = p.read_text()
          s = s.replace("import androidx.media3.session.*", "import androidx.media3.session.MediaController\nimport androidx.media3.session.SessionCommand\nimport androidx.media3.session.SessionResult\nimport androidx.media3.session.SessionToken")
          s = s.replace("val background=ImageView(this).apply { scaleType=ImageView.ScaleType.CENTER_CROP; alpha=.35f }", "val backgroundImage=ImageView(this).apply { scaleType=ImageView.ScaleType.CENTER_CROP; alpha=.35f }")
          s = s.replace("card.addView(background,FrameLayout.LayoutParams(-1,-1))", "card.addView(backgroundImage,FrameLayout.LayoutParams(-1,-1))")
          s = s.replace("if(back!=null) background.load(back)", "if(back!=null) backgroundImage.load(back)")
          p.write_text(s)
          PY

      - name: Build and test debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/open-city-radio-dev.apk
          sha256sum release/open-city-radio-dev.apk > release/open-city-radio-dev.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-city-radio-debug-apk
          path: |
            release/open-city-radio-dev.apk
            release/open-city-radio-dev.apk.sha256
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            release/open-city-radio-dev.apk \
            release/open-city-radio-dev.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Open City Radio - Latest Test APK" \
            --notes "Automatically built from the latest main branch commit. This is a debug-signed test build for direct installation on Android, not a Play Store production release." \
            --prerelease
